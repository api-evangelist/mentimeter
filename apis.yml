name: Mentimeter
description: >-
  Mentimeter is a Swedish audience-engagement and interactive-presentation
  platform used to run live polls, quizzes, word clouds, ranking, open-ended
  questions and Q&A during meetings, classrooms and events, with results
  updating in real time as participants respond from their phones. Founded in
  Stockholm in 2014, it is used across education and enterprise for interactive
  presentations and workshops. Mentimeter does not publish a public developer
  REST API; its extensibility surface is delivered through LMS integrations
  (Canvas, Blackboard, Moodle, Brightspace via LTI), presentation add-ins
  (PowerPoint, Microsoft Teams, Zoom) and SSO, rather than a documented HTTP
  API. This profile was surfaced as a 500 Global portfolio company and enriched
  by the API Evangelist pipeline against its public developer, security and
  trust surface.
